spring:
  application:
    name: restaurant-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  cache:
    type: redis
    redis:
      time-to-live: 5m
      key-prefix: "restaurant:"
      use-key-prefix: true

minio:
  url: ${MINIO_URL}
  access:
    name: ${MINIO_USER}
    secret: ${MINIO_PASSWORD}
  bucket:
    name: ${MINIO_BUCKET_NAME}
